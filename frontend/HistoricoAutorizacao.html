<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Histórico de Autorizações - Oggi Sorvetes</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="/public/app.js"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/historico.css"/>
</head>
<body class="min-h-screen flex flex-col">
<!-- TopNavBar (JSON Managed) -->
<header class="bg-surface-container-lowest dark:bg-surface-container-lowest shadow-sm dark:shadow-none border-b border-surface-variant sticky top-0 z-50">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
<div class="flex items-center gap-8">
<span class="font-headline-lg text-headline-lg text-primary font-bold">Oggi Sorvetes Admin</span>
<nav class="hidden md:flex gap-6 items-center">
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-200 font-label-md text-label-md" href="/">Nova Autorização</a>
<a class="text-primary font-bold border-b-2 border-primary pb-1 font-label-md text-label-md" href="/HistoricoAutorizacao.html">Histórico</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-200 font-label-md text-label-md" href="/GestaoFuncionarios.html">Funcionários</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-200 font-label-md text-label-md" href="/ConfiguracaoFuncionario.html">Configurações</a>
</nav>
</div>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</button>
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">account_circle</span>
</button>
</div>
</div>
</header>
<main class="flex-grow w-full max-w-7xl mx-auto px-6 py-8">
<!-- Header Section -->
<div class="mb-8">
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-2">Histórico de Autorizações</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Consulte, reimprima ou cancele autorizações de entrada e saída emitidas pelo sistema.</p>
</div>
<!-- Filters Grid -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
<div class="md:col-span-2 bento-card p-4 flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant">Buscar por Nome</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full pl-10 pr-4 py-2 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-body-md" placeholder="Digite o nome do funcionário..." type="text"/>
</div>
</div>
<div class="bento-card p-4 flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant">Período (Início)</label>
<input class="w-full px-4 py-2 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-body-md" type="date"/>
</div>
<div class="bento-card p-4 flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant">Período (Fim)</label>
<input class="w-full px-4 py-2 border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-body-md" type="date"/>
</div>
</div>
<!-- Table Container -->
<div class="bento-card overflow-hidden">
<div class="overflow-x-auto custom-scrollbar">
<table class="w-full text-left border-collapse">
<thead>
<tr class="bg-surface-container border-b border-surface-variant">
<th class="px-6 py-4 font-label-md text-label-md text-on-surface">Data</th>
<th class="px-6 py-4 font-label-md text-label-md text-on-surface">Nome do Funcionário</th>
<th class="px-6 py-4 font-label-md text-label-md text-on-surface">Tipo</th>
<th class="px-6 py-4 font-label-md text-label-md text-on-surface">Supervisor</th>
<th class="px-6 py-4 font-label-md text-label-md text-on-surface text-right">Ações</th>
</tr>
</thead>
<tbody id="authorization-list" class="divide-y divide-surface-variant">
<tr><td colspan="5" class="px-6 py-4 text-on-surface-variant">Carregando...</td></tr>
</tbody>
<!-- Sample rows omitted for brevity in the organized file -->
</table>
</div>
<!-- Pagination -->
<div class="px-6 py-4 bg-surface-container-low flex items-center justify-between">
<span class="font-body-md text-body-md text-on-surface-variant">Exibindo 1 a 5 de 142 registros</span>
<div class="flex gap-2">
<button class="p-2 rounded-lg border border-outline-variant hover:bg-surface-container transition-colors disabled:opacity-50" disabled="">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<button class="px-4 py-2 rounded-lg bg-primary text-on-primary font-label-md text-label-md">1</button>
<button class="px-4 py-2 rounded-lg border border-outline-variant hover:bg-surface-container transition-colors font-label-md text-label-md">2</button>
<button class="px-4 py-2 rounded-lg border border-outline-variant hover:bg-surface-container transition-colors font-label-md text-label-md">3</button>
<button class="p-2 rounded-lg border border-outline-variant hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</div>
</div>
</main>
<!-- FAB for quick action (Optional, for UI richness) -->
<button class="fixed bottom-8 right-8 w-14 h-14 bg-primary-container text-on-primary-container rounded-full shadow-lg flex items-center justify-center hover:scale-105 active:scale-95 transition-all group">
<span class="material-symbols-outlined text-2xl group-hover:rotate-90 transition-transform">add</span>
<span class="absolute right-16 bg-inverse-surface text-inverse-on-surface px-3 py-1 rounded-md text-label-sm font-label-sm opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Nova Autorização</span>
</button>
<!-- Background Decoration (Light Gradient) -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-secondary/5 rounded-full blur-3xl"></div>
</div>
<script src="js/historico.js"></script>
</body></html>
